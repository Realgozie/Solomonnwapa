kind = "web"
previewPath = "/"
title = "Solomon Nwapa Portfolio"
description = "A professional portfolio showcasing Solomon Nwapa’s software projects, capabilities, engineering approach, and contact information."
version = "1.0.0"
id = "artifacts/solomon-nwapa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25959

[services.development]
run = "pnpm --filter @workspace/solomon-nwapa run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/solomon-nwapa", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/solomon-nwapa", "run", "start"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "25959"

[services.env]
PORT = "25959"
BASE_PATH = "/"
